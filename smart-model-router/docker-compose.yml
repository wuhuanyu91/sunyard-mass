version: "3.9"

# ============================================================
# MAS 智能模型路由访问平台 — Docker Compose
# 模型推理服务（Ollama 等）假设已在外部独立部署，
# 通过 MAS_MODEL_ENDPOINT 环境变量指定其地址。
# OmniRoute 作为 AI 网关层，MAS 经其转发请求至推理引擎。
# ============================================================

services:
  # ---- PostgreSQL 16 + pgvector ----
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mas-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-pg.sql:/docker-entrypoint-initdb.d/init-pg.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ---- OmniRoute AI 网关 ----
  omniroute:
    image: diegosouzapw/omniroute:latest
    container_name: mas-omniroute
    ports:
      - "20128:20128"
    environment:
      OMNIRoute_PROVIDER: "openai-compatible"
      OMNIRoute_BASE_URL: "${MAS_MODEL_ENDPOINT:-http://host.docker.internal:11434/v1}"
      OMNIRoute_API_KEY: "not-needed"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:20128/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ---- MAS 智能模型路由 ----
  mas:
    build: .
    container_name: mas-app
    ports:
      - "9090:9090"
    environment:
      MAS_DB_URL: "jdbc:postgresql://postgres:5432/mas"
      MAS_DB_USERNAME: mas
      MAS_DB_PASSWORD: mas123
      # 外部模型推理服务地址（部署时按实际环境覆盖）
      MAS_MODEL_ENDPOINT: "http://host.docker.internal:11434/v1"
      # OmniRoute 网关（经 omniroute 容器转发至推理引擎）
      MAS_OMNIROUTE_ENABLED: "true"
      MAS_OMNIROUTE_ENDPOINT: "http://omniroute:20128"
    depends_on:
      postgres:
        condition: service_healthy
      omniroute:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
