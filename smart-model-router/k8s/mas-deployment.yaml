# MAS 智能模型路由访问平台
# 模型推理服务（Ollama / vLLM / TGI 等）假设已在外部独立部署，
# MAS 通过 ConfigMap 中的 MAS_MODEL_ENDPOINT 环境变量访问对应接口。
# OmniRoute 作为 sidecar 容器部署，MAS 经其转发请求至推理引擎。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mas
  namespace: mas
  labels:
    app: mas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mas
  template:
    metadata:
      labels:
        app: mas
    spec:
      # initContainer: 等待 DB 就绪后执行 K8s 版种子数据
      initContainers:
        - name: wait-db-seed
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "Waiting for PostgreSQL..."
              until pg_isready -h postgres-svc -p 5432 -U postgres; do
                sleep 2
              done
              echo "Executing K8s seed data..."
              PGPASSWORD=mas123 psql -h postgres-svc -U mas -d mas -f /seed/data-k8s.sql || true
          volumeMounts:
            - name: seed-sql
              mountPath: /seed
      containers:
        - name: mas
          image: mas-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          envFrom:
            - configMapRef:
                name: mas-config
          livenessProbe:
            httpGet:
              path: /smart-router/actuator/health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /smart-router/actuator/health
              port: 9090
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
        # OmniRoute AI 网关 sidecar：与 MAS 共享 Pod network namespace，localhost:20128 可达
        - name: omniroute
          image: diegosouzapw/omniroute:latest
          ports:
            - containerPort: 20128
          env:
            - name: OMNIRoute_PROVIDER
              value: "openai-compatible"
            - name: OMNIRoute_BASE_URL
              value: "$(MAS_MODEL_ENDPOINT)"
            - name: OMNIRoute_API_KEY
              value: "not-needed"
          livenessProbe:
            httpGet:
              path: /livez
              port: 20128
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 20128
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
      volumes:
        - name: seed-sql
          configMap:
            name: mas-seed-sql
