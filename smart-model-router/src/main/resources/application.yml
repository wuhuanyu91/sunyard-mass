server:
  port: 9090

spring:
  application:
    name: mas
  webflux:
    base-path: /smart-router
  datasource:
    url: ${MAS_DB_URL:jdbc:postgresql://localhost:5432/mas}
    username: ${MAS_DB_USERNAME:mas}
    password: ${MAS_DB_PASSWORD:mas123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  level:
    com.sunyard.llm.mas: INFO

mas:
  backend:
    # 外部模型推理服务端点（Ollama / vLLM / TGI 等，假设已独立部署）
    default-endpoint: ${MAS_MODEL_ENDPOINT:http://localhost:11434/v1}
    timeout: 60s
    # 按路由 model_id 映射后端真实模型名。
    # 未配置的 model_id 原样转发（后端模型名与 model_id 一致时应留空）。
    model-overrides:
      qwen-72b: gpt-oss:20b      # complex 档：大参数对话模型
      qwen-lite: qwen2.5:0.5b    # simple 档：小参数对话模型
  cache:
    exact-ttl: 30m
    max-exact-entries: 100000
    semantic-ttl: 60m
    semantic-threshold: 0.95
    # §8 改进：按意图类型覆盖语义缓存阈值（可选，未配置的意图回退到全局默认）
    semantic-threshold-by-intent:
      chat: 0.93
      embedding: 0.97
    max-semantic-entries: 50000
    embedding-model: bge-m3
  rate-limit:
    per-user-qps: 20
  blacklist:
    users:
      - banned-user
  sensitive-words:
    path: classpath:sensitive-words.txt
  quota:
    per-user-per-minute: 100000
    per-user-per-day: 5000000
  routing:
    default-model: qwen-72b
    difficulty:
      enabled: true      # 难度路由开关：无显式 model 时按难度分分流 simple/complex 模型
      threshold: 0.5     # 评分 >= 阈值 → complex（大参数模型）
  compress:
    max-context-tokens: 4096
  # §8 改进：熔断器配置（故障转移）
  circuit-breaker:
    failure-threshold: 5
    open-duration: 30s
    half-open-max-attempts: 2
